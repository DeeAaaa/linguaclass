<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="lg-g" x1="12" y1="0" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lg-light" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Open book (left page) -->
  <path d="M60 24 C60 24 36 16 20 20 C16 20.8 12 24 12 30 L12 90 C12 96 18 100 24 98 C36 94 52 90 60 90"
        fill="url(#lg-g)" opacity="0.95"/>
  <path d="M60 24 C60 24 36 16 20 20"
        fill="none" stroke="url(#lg-g)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Open book (right page) -->
  <path d="M60 24 C60 24 84 16 100 20 C104 20.8 108 24 108 30 L108 90 C108 96 102 100 96 98 C84 94 68 90 60 90"
        fill="url(#lg-g)" opacity="0.85"/>
  <path d="M60 24 C60 24 84 16 100 20"
        fill="none" stroke="url(#lg-g)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center spine -->
  <line x1="60" y1="24" x2="60" y2="90" stroke="white" stroke-width="2" opacity="0.4"/>

  <!-- Speech bubble emerging from the book -->
  <ellipse cx="60" cy="50" rx="22" ry="14" fill="white" opacity="0.95"/>
  <path d="M48 58 L54 64 L52 56 Z" fill="white" opacity="0.95"/>

  <!-- Three small dots inside speech bubble (language/text symbol) -->
  <circle cx="50" cy="48" r="3" fill="url(#lg-g)"/>
  <circle cx="60" cy="48" r="3" fill="url(#lg-g)"/>
  <circle cx="70" cy="48" r="3" fill="url(#lg-g)"/>

  <!-- Small graduation cap accent above the book -->
  <path d="M56 20 L60 16 L64 20 L60 18.5 Z" fill="url(#lg-light)" opacity="0.9"/>
  <path d="M52 20 L56 20 L56 24 L52 24 Z" fill="url(#lg-light)" opacity="0.7"/>

  <!-- Subtle globe ring -->
  <ellipse cx="60" cy="72" rx="20" ry="6" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
</svg>
